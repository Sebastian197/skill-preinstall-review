name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Lint
        run: |
          python -m pip install ruff==0.17.1
          ruff check .

      - name: Docker is available
        run: docker info --format '{{.ServerVersion}}'

      # The sandbox tests are skipped when Docker is missing. Fail instead,
      # so a green run always includes them.
      - name: Tests
        working-directory: tests
        shell: bash  # adds -o pipefail, so a failing test is not hidden by tee
        run: |
          python -m unittest -v 2>&1 | tee ../test.log
          ! grep -q "skipped 'Docker is not running'" ../test.log
